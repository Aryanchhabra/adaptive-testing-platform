<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neural Network Visualization -->
  <g id="neural-network">
    <!-- Nodes -->
    <circle cx="300" cy="200" r="80" fill="#0A66C2" opacity="0.2"/>
    <circle cx="300" cy="200" r="60" fill="#0A66C2" opacity="0.3"/>
    <circle cx="300" cy="200" r="40" fill="#0A66C2" opacity="0.4"/>
    
    <!-- Connection Lines -->
    <path d="M200 150 L400 250" stroke="#0A66C2" stroke-width="2" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M200 250 L400 150" stroke="#0A66C2" stroke-width="2" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
    
    <!-- Animated Particles -->
    <circle cx="300" cy="200" r="3" fill="#0A66C2">
      <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Binary Code Background -->
  <text x="50" y="380" fill="#0A66C2" opacity="0.1" font-family="monospace" font-size="14">
    01001001 01000001 01001100 01000101 01000001 01010010 01001110
  </text>
</svg> 